[project]
name = "finagentic"
version = "0.1.0"
description = "Verified-ledger financial statement analysis engine"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-multipart>=0.0.12",
    "sqlalchemy>=2.0.36",
    "psycopg[binary]>=3.2",
    "alembic>=1.14",
    "pgvector>=0.3.6",
    "pymupdf>=1.24",
    "pdfplumber>=0.11",
    "langchain>=0.3",
    "langchain-anthropic>=0.3",
    "langgraph>=0.2.50",
    "httpx>=0.27",
    "structlog>=24.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "hypothesis>=6.115",
    "ruff>=0.8",
    "mypy>=1.13",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["finagentic*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error::DeprecationWarning:finagentic.*"]
# asyncio_mode is set once the FastAPI layer lands and pytest-asyncio is installed.

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Data tables: one aligned entry per line reads far better than the same entries
# wrapped across three lines each, and some us-gaap tag names are 100+ chars.
"finagentic/domain/concepts.py" = ["E501"]
"finagentic/ingest/tag_map.py" = ["E501"]
# B008 flags function calls in argument defaults, but `Depends(...)` and
# `Query(...)` in defaults is FastAPI's documented dependency-injection idiom.
"finagentic/api/app.py" = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
