services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: finagentic-postgres
    environment:
      POSTGRES_USER: finagentic
      POSTGRES_PASSWORD: finagentic
      POSTGRES_DB: finagentic
    ports:
      - "5433:5432"
    volumes:
      - finagentic-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finagentic -d finagentic"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  finagentic-pgdata:
